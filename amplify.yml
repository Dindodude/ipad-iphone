version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - printf "NEXT_PUBLIC_SUPABASE_URL=%s\n" "$NEXT_PUBLIC_SUPABASE_URL" >> .env.production
        - printf "NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n" "$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env.production
        - printf "SUPABASE_SERVICE_ROLE_KEY=%s\n" "$SUPABASE_SERVICE_ROLE_KEY" >> .env.production
        - printf "ZENTRIXA_ADMIN_EMAIL=%s\n" "$ZENTRIXA_ADMIN_EMAIL" >> .env.production
        - printf "ZENTRIXA_ADMIN_PASSWORD=%s\n" "$ZENTRIXA_ADMIN_PASSWORD" >> .env.production
        - printf "ZENTRIXA_SESSION_SECRET=%s\n" "$ZENTRIXA_SESSION_SECRET" >> .env.production
        - printf "OPENAI_API_KEY=%s\n" "$OPENAI_API_KEY" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
